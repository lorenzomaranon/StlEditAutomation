<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grabador de texto STL</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --text:#1d2330; --muted:#6b7280; --line:#e2e5ea; --accent:#2563eb;
          --front:#e4572e; --left:#17a398; --right:#7b4fd6; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; color:var(--text); background:var(--bg);
         display:grid; grid-template-columns: 380px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  .face { border:1px solid var(--line); border-left:5px solid var(--c); border-radius:8px; padding:10px; margin-bottom:12px; }
  .face h2 { font-size:14px; margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .face textarea { width:100%; font:inherit; font-size:16px; padding:6px; border:1px solid var(--line); border-radius:6px; resize:vertical; min-height:36px; }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; margin-top:6px; }
  label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:2px; }
  input, select { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; width:100%; }
  button { font:inherit; padding:7px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.small { padding:3px 8px; font-size:12px; }
  button.active { background:var(--c); color:#fff; border-color:var(--c); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  #status { font-size:13px; color:var(--muted); min-height:20px; white-space:pre-line; }
  #status.warn { color:#b45309; }
  #status.err { color:#b91c1c; }
  main { position:relative; }
  #view { width:100%; height:100%; display:block; }
  #hint { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:#111827e0; color:#fff;
          padding:8px 14px; border-radius:6px; display:none; }
  details { margin-top:14px; font-size:13px; }
  @media (max-width: 800px) { body { grid-template-columns:1fr; grid-template-rows:auto 60vh; height:auto; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<aside>
  <h1>Grabador de texto STL</h1>
  <div id="faces"></div>
  <div class="row">
    <button class="primary" id="generate">Generar</button>
    <button id="download" disabled>Descargar STL</button>
    <label style="flex-direction:row;align-items:center;gap:4px"><input type="checkbox" id="auto" checked style="width:auto">auto</label>
  </div>
  <div id="status"></div>
  <details>
    <summary>Calibración de caras</summary>
    <p>Pulsa <b>Marcar</b> en una cara y haz clic sobre el modelo, en el punto donde quieres el centro del texto.
       La orientación del texto se ajusta con <i>Giro</i>. Luego pulsa <b>Guardar ajustes</b> para que se recuerde
       (también se guardan altura, profundidad, fuente, etc.).</p>
    <div class="row">
      <button id="save">Guardar ajustes</button>
      <button id="autodetect">Autodetectar caras</button>
      <button id="showTemplate">Ver original</button>
    </div>
  </details>
</aside>
<main>
  <canvas id="view"></canvas>
  <div id="hint"></div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main", "claude/**"]
    paths-ignore: ["README.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Prueba rápida del motor de grabado
        run: python engrave.py --front "TEST" --left "Ñandú" --right "123" -o test.stl

      - name: Tests (cambios de color, perfiles de OrcaSlicer)
        run: |
          pip install pytest
          python -m pytest -q tests

      - name: PyInstaller
        run: pyinstaller GrabadorSTL.spec --noconfirm

      - name: Comprobar que el ejecutable arranca el servidor
        shell: pwsh
        run: |
          $env:GRABADOR_SELFTEST = "1"
          $p = Start-Process -FilePath dist\GrabadorSTL\GrabadorSTL.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:APPDATA\GrabadorSTL\error.log" -ErrorAction SilentlyContinue; exit 1 }

      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.${{ github.run_number }}" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: GrabadorSTL-Setup
          path: Output/GrabadorSTL-Setup.exe

      - name: Publicar Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Output/GrabadorSTL-Setup.exe
